<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4f6ef7">
<title>雅思背单词</title>
<style>
  :root{ --blue:#4f6ef7; --bg:#f5f6f8; --card:#fff; --text:#1a1a1a; --sub:#8a8f98; --yellow:#fff6c9; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{margin:0; padding:0;}
  body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden;}
  .app{max-width:520px; margin:0 auto; height:100%; display:flex; flex-direction:column;}
  header{padding:12px 16px 8px; flex-shrink:0;}
  .title{font-size:19px; font-weight:700;}
  .tabs{display:flex; background:#e8eaef; border-radius:10px; padding:3px; margin-top:10px; width:fit-content;}
  .tabs button{border:none; background:transparent; padding:7px 16px; font-size:15px; border-radius:8px; color:var(--sub); cursor:pointer; font-weight:500;}
  .tabs button.active{background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  main{flex:1; overflow:hidden; display:flex; flex-direction:column;}

  #studyView{flex:1; display:flex; flex-direction:column; overflow:hidden; padding:0 16px;}
  .bar{font-size:13px; color:var(--sub); text-align:center; margin:4px 0 10px;}
  .groupnav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-shrink:0;}
  .groupnav button{padding:9px 18px; border:none; border-radius:11px; font-size:15px; font-weight:600; cursor:pointer; background:#eef1ff; color:var(--blue);}
  .groupnav button:disabled{opacity:.35;}
  .groupnav .glabel{font-size:14px; font-weight:600; color:var(--text);}
  .stream{flex:1; overflow-y:auto; padding-bottom:24px;}
  .wcard{background:var(--card); border-radius:16px; padding:16px 16px 14px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .wtop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .wword{font-size:26px; font-weight:700; word-break:break-word;}
  .wbtns{display:flex; gap:6px; flex-shrink:0; align-items:center;}
  .spk{border:none; border-radius:14px; padding:6px 12px; font-size:13px; cursor:pointer; background:#eef1ff; color:var(--blue); font-weight:500;}
  .spk.uk{background:#fff4e6; color:#d97706;}
  .fav{border:none; border-radius:14px; padding:5px 10px; font-size:15px; cursor:pointer; background:#f0f1f3; color:#b3b8c0;}
  .fav.on{background:#fff3c4; color:#d9a514;}
  .wphon{font-size:14px; color:var(--sub); margin-top:4px;}
  .wmean{font-size:17px; line-height:1.55; margin-top:10px;}
  .wex{font-size:13px; color:var(--sub); line-height:1.5; margin-top:8px; font-style:italic;}

  #browseView{flex:1; display:flex; flex-direction:column; overflow:hidden; padding:0 16px;}
  .search{width:100%; padding:12px 14px; border:1px solid #dde1e8; border-radius:12px; font-size:16px; margin:8px 0; background:#fff; -webkit-user-select:text; user-select:text;}
  .bheadrow{display:flex; align-items:center; justify-content:space-between; margin:2px 2px 8px; flex-shrink:0;}
  .bcount{font-size:13px; color:var(--sub);}
  .filtermode{font-size:13px; cursor:pointer; padding:5px 12px; border:1px solid #dde1e8; border-radius:14px; background:#fff; color:var(--sub);}
  .filtermode.on{background:var(--blue); color:#fff; border-color:var(--blue);}
  .blist{list-style:none; margin:0; padding:0 0 24px; overflow-y:auto; flex:1;}
  .ghead{display:flex; align-items:center; justify-content:space-between; padding:13px 6px; font-size:15px; font-weight:600; color:var(--text); border-bottom:1px solid #eef0f3; cursor:pointer;}
  .ghead .gcaret{color:var(--sub); transition:transform .15s; font-size:13px;}
  .ghead.open .gcaret{transform:rotate(180deg);}
  .gbody{display:none; padding:2px 0 6px;}
  .gbody.open{display:block;}
  .bitem{display:flex; align-items:flex-start; gap:8px; padding:10px 4px; border-bottom:1px solid #f2f4f7; font-size:16px; border-radius:8px;}
  .bitem.fav{background:var(--yellow);}
  .bitem .w{font-weight:600; white-space:nowrap;}
  .bitem .m{color:#444; flex:1; line-height:1.45;}
  .bitem .wbtns{display:flex; gap:4px; flex-shrink:0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">雅思背单词</div>
    <div class="tabs">
      <button id="tabStudy" class="active">学习</button>
      <button id="tabBrowse">全部单词</button>
    </div>
  </header>

  <main>
    <section id="studyView">
      <div class="bar" id="studyBar"></div>
      <div class="groupnav">
        <button id="prevGroup">← 上一组</button>
        <span class="glabel" id="groupLabel"></span>
        <button id="nextGroup">下一组 →</button>
      </div>
      <div class="stream" id="stream"></div>
    </section>

    <section id="browseView" style="display:none">
      <input id="searchBox" class="search" type="text" placeholder="输入单词或释义搜索…">
      <div class="bheadrow">
        <span class="bcount" id="browseCount"></span>
        <button class="filtermode" id="favFilter">只看收藏</button>
      </div>
      <ul class="blist" id="browseList"></ul>
    </section>
  </main>
</div>

<script>
const WORDS = __WORDS_JSON__;
const GROUP = 50;
const total = WORDS.length;
const groups = Math.ceil(total / GROUP);
const LS = 'ielts_group_v1';
const LS_FAV = 'ielts_fav_v1';

let cur = load();
let fav = new Set(loadFav());
let favOnly = false;

function load(){
  try{ const v = parseInt(localStorage.getItem(LS),10); if(!isNaN(v) && v>=0 && v<groups) return v; }catch(e){}
  return 0;
}
function save(){ try{ localStorage.setItem(LS, String(cur)); }catch(e){} }
function loadFav(){
  try{ const a = JSON.parse(localStorage.getItem(LS_FAV)); if(Array.isArray(a)) return a; }catch(e){}
  return [];
}
function saveFav(){ try{ localStorage.setItem(LS_FAV, JSON.stringify([...fav])); }catch(e){} }
function groupRange(g){ return WORDS.slice(g*GROUP, (g+1)*GROUP); }

function speakText(word, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = lang; u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderStudy(){
  const list = groupRange(cur);
  let html = '';
  for(const r of list){
    const w = r[0];
    html += '<div class="wcard">' +
      '<div class="wtop"><span class="wword">'+esc(w)+'</span>' +
      '<span class="wbtns">' +
      '<button class="spk" data-w="'+esc(w)+'" data-lang="en-US">美</button>' +
      '<button class="spk uk" data-w="'+esc(w)+'" data-lang="en-GB">英</button>' +
      '<button class="fav'+(fav.has(w)?' on':'')+'" data-w="'+esc(w)+'">'+(fav.has(w)?'⭐':'☆')+'</button>' +
      '</span></div>' +
      (r[1] ? '<div class="wphon">'+esc(r[1])+'</div>' : '') +
      (r[2] ? '<div class="wmean">'+esc(r[2])+'</div>' : '') +
      (r[3] ? '<div class="wex">例：'+esc(r[3])+'</div>' : '') +
      '</div>';
  }
  document.getElementById('stream').innerHTML = html;
  document.getElementById('stream').scrollTop = 0;
  document.getElementById('groupLabel').textContent = '第 '+(cur+1)+' / '+groups+' 组';
  document.getElementById('studyBar').textContent = '每日 50 词 · 已学 '+(cur+1)+'/'+groups+' 组';
  document.getElementById('prevGroup').disabled = (cur===0);
  document.getElementById('nextGroup').disabled = (cur===groups-1);
}

document.getElementById('prevGroup').addEventListener('click', ()=>{ if(cur>0){ cur--; save(); renderStudy(); } });
document.getElementById('nextGroup').addEventListener('click', ()=>{ if(cur<groups-1){ cur++; save(); renderStudy(); } });
document.getElementById('stream').addEventListener('click', e=>{
  const fbtn = e.target.closest('.fav');
  if(fbtn){
    const w = fbtn.dataset.w;
    if(fav.has(w)) fav.delete(w); else fav.add(w);
    saveFav();
    fbtn.classList.toggle('on', fav.has(w));
    fbtn.textContent = fav.has(w) ? '⭐' : '☆';
    return;
  }
  const sbtn = e.target.closest('.spk');
  if(sbtn) speakText(sbtn.dataset.w, sbtn.dataset.lang);
});

function bitem(w, m){
  const isFav = fav.has(w);
  return '<li class="bitem'+(isFav?' fav':'')+'"><span class="w">'+esc(w)+(isFav?' ⭐':'')+'</span><span class="m">'+esc(m)+'</span>' +
    '<span class="wbtns"><button class="spk" data-w="'+esc(w)+'" data-lang="en-US">美</button>' +
    '<button class="spk uk" data-w="'+esc(w)+'" data-lang="en-GB">英</button></span></li>';
}
function renderBrowse(){
  const kw = document.getElementById('searchBox').value.trim().toLowerCase();
  let html = '';
  if(kw){
    let n = 0;
    for(const r of WORDS){
      const w=r[0], m=r[2];
      if(w.toLowerCase().indexOf(kw)<0 && m.toLowerCase().indexOf(kw)<0) continue;
      html += bitem(w, m); n++;
    }
    document.getElementById('browseList').innerHTML = html;
    document.getElementById('browseCount').textContent = '共 '+n+' 个词';
  } else if(favOnly){
    let n = 0;
    for(const r of WORDS){
      if(fav.has(r[0])){ html += bitem(r[0], r[2]); n++; }
    }
    document.getElementById('browseList').innerHTML = html || '<li style="color:#aaa;padding:20px 0;text-align:center">还没有收藏的词</li>';
    document.getElementById('browseCount').textContent = '收藏 '+n+' 个词';
  } else {
    for(let g=0; g<groups; g++){
      html += '<li class="ghead" data-g="'+g+'"><span>第 '+(g+1)+' 组（'+groupRange(g).length+' 词）</span><span class="gcaret">▾</span></li>';
      html += '<div class="gbody" data-g="'+g+'">';
      for(const r of groupRange(g)) html += '<ul style="list-style:none;margin:0;padding:0">'+bitem(r[0], r[2])+'</ul>';
      html += '</div>';
    }
    document.getElementById('browseList').innerHTML = html;
    document.getElementById('browseCount').textContent = '共 '+groups+' 组 · '+total+' 词';
  }
}
document.getElementById('browseList').addEventListener('click', e=>{
  const head = e.target.closest('.ghead');
  if(head){
    const g = head.dataset.g;
    const body = document.querySelector('.gbody[data-g="'+g+'"]');
    body.classList.toggle('open');
    head.classList.toggle('open');
    return;
  }
  const btn = e.target.closest('.spk');
  if(btn) speakText(btn.dataset.w, btn.dataset.lang);
});
document.getElementById('searchBox').addEventListener('input', renderBrowse);
document.getElementById('favFilter').addEventListener('click', ()=>{
  favOnly = !favOnly;
  document.getElementById('favFilter').classList.toggle('on', favOnly);
  renderBrowse();
});

document.getElementById('tabStudy').addEventListener('click', ()=>switchTab('study'));
document.getElementById('tabBrowse').addEventListener('click', ()=>switchTab('browse'));
function switchTab(t){
  document.getElementById('tabStudy').classList.toggle('active', t==='study');
  document.getElementById('tabBrowse').classList.toggle('active', t==='browse');
  document.getElementById('studyView').style.display = t==='study' ? 'flex' : 'none';
  document.getElementById('browseView').style.display = t==='browse' ? 'flex' : 'none';
  if(t==='browse') renderBrowse();
}

renderStudy();
renderBrowse();
</script>
</body>
</html>
